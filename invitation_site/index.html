<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточки с изображениями</title>
  <style>
    /* Общие стили страницы */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fdf0f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* Контейнер списка */
    .list-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }

    /* Стили отдельной карточки */
    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #fff5f7;
      border: 1.5px solid #ffccd5;
      border-radius: 30px;
      padding: 14px 22px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    /* Левая часть (иконка + текст) */
    .card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Иконки image_481 и image_482 */
    .card-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0; /* Фиксирует иконку и предотвращает наложение текста */
    }

    /* Текст внутри карточки */
    .card-title {
      font-size: 20px;
      font-weight: 500;
      color: #000000;
    }

    /* Правая часть карточки */
    .card-right {
      display: flex;
      align-items: center;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="list-container">
    
    <!-- Карточка 1 -->
    <div class="card">
      <div class="card-left">
        <img src="image_481.png" alt="Иконка" class="card-icon">
        <span class="card-title">Приглашение 💖 🔻</span>
      </div>
      <div class="card-right">💕</div>
    </div>

    <!-- Карточка 2 -->
    <div class="card">
      <div class="card-left">
        <img src="image_482.png" alt="Иконка" class="card-icon">
        <span class="card-title">Котики и винил</span>
      </div>
      <div class="card-right">●</div>
    </div>

  </div>

</body>
</html>
